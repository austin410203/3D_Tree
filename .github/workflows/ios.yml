# iOS builds on a cloud Mac (no local Mac needed).
#  - "Run workflow": compile the app for the iOS Simulator (unsigned), launch it and check the native
#    Store / BackgroundAudio plugins answer, to prove the Xcode project builds and runs
#  - "Run workflow" with testflight=true: also archive, sign and upload to TestFlight
#    needs repo secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, .p8 contents)
#    the key must have the Admin role: cloud signing refuses App Manager keys
# Manual only: macOS minutes count 10x against the Actions quota while the repo is private.
name: iOS

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
      - run: npm ci
      - run: node scripts/build-www.mjs && npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Run in the simulator and check the native plugins
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          # console-pty streams the app's stdout (Capacitor logs every JS -> native call)
          script -q -F app.log xcrun simctl launch --console-pty "$DEVICE" com.austin410203.seasontree > /dev/null 2>&1 &
          sleep 40
          xcrun simctl io "$DEVICE" screenshot sim.png || true
          echo "---- app stdout (last 80 lines) ----"; tail -n 80 app.log || true
          echo "---- is the app still running? ----"; xcrun simctl spawn "$DEVICE" launchctl list | grep -i seasontree || echo "app not running"
          echo "---- system log for the app (last 60 lines) ----"
          xcrun simctl spawn "$DEVICE" log show --last 3m --style compact --predicate 'process == "App"' 2>/dev/null | grep -v -i "fault\b" | tail -n 60 || true
          grep -q "To Native ->  Store getEntitlements" app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: |
            sim.png
            app.log
          if-no-files-found: ignore

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
      - run: npm ci
      - run: node scripts/build-www.mjs && npx cap sync ios
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          K="$RUNNER_TEMP/keys/AuthKey.p8"
          # Notepad pastes add CR; add the BEGIN/END lines if they were left out
          printf '%s\n' "$ASC_KEY_P8" | tr -d '\r' | sed '/^[[:space:]]*$/d' > "$K"
          if ! grep -q 'BEGIN PRIVATE KEY' "$K"; then
            { echo '-----BEGIN PRIVATE KEY-----'; tr -d ' \n' < "$K" | fold -w 64; echo; echo '-----END PRIVATE KEY-----'; } > "$K.tmp" && mv "$K.tmp" "$K"
          fi
          openssl pkey -in "$K" -noout || { echo "::error::ASC_KEY_P8 is not a valid private key (paste the whole .p8 again)"; exit 1; }
      - name: Check the key against the App Store Connect API
        env:
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          pip3 install --quiet --break-system-packages pyjwt cryptography 2>/dev/null || pip3 install --quiet pyjwt cryptography
          python3 - <<'PY'
          import os, time, urllib.request, urllib.error, jwt
          key = open(os.environ["RUNNER_TEMP"] + "/keys/AuthKey.p8").read()
          tok = jwt.encode({"iss": os.environ["ISSUER"], "iat": int(time.time()), "exp": int(time.time()) + 600,
                            "aud": "appstoreconnect-v1"}, key, algorithm="ES256", headers={"kid": os.environ["KEY_ID"]})
          req = urllib.request.Request("https://api.appstoreconnect.apple.com/v1/apps?limit=1", headers={"Authorization": "Bearer " + tok})
          try:
              print("App Store Connect API:", urllib.request.urlopen(req).status)
          except urllib.error.HTTPError as e:
              print("::error::App Store Connect API answered", e.code, "- ASC_KEY_ID must be the Key ID of the pasted .p8", e.read()[:300].decode(errors="replace"))
              raise SystemExit(1)
          PY
      - name: Archive and upload
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $RUNNER_TEMP/keys/AuthKey.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          # keep the error lines: tail alone hid why the archive failed
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release             -destination 'generic/platform=iOS' -archivePath build/App.xcarchive             DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }}             $AUTH archive 2>&1 | tee archive.log | grep -v 'DVTServices: Received response' | tail -n 40             || { grep -E 'error:|Error' archive.log | grep -v DVTServices | head -n 30; exit 1; }
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist             -exportPath build/export $AUTH 2>&1 | tee export.log | grep -v 'DVTServices: Received response' | tail -n 40             || { grep -q "Cloud signing permission" export.log && echo "::error::Cloud signing needs an Admin-role API key; App Manager keys cannot export"; exit 1; }
      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
