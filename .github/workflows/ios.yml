# iOS builds on a cloud Mac (no local Mac needed).
#  - "Run workflow": compile the app for the iOS Simulator (unsigned), launch it and check the native
#    Store / BackgroundAudio plugins answer, to prove the Xcode project builds and runs
#  - "Run workflow" with testflight=true: also archive, sign and upload to TestFlight
#    needs repo secrets: APPLE_TEAM_ID, ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 (App Store Connect API key, .p8 contents)
# Manual only: macOS minutes count 10x against the Actions quota while the repo is private.
name: iOS

on:
  workflow_dispatch:
    inputs:
      testflight:
        description: Upload a signed build to TestFlight
        type: boolean
        default: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
      - run: npm ci
      - run: node scripts/build-www.mjs && npx cap sync ios
      - name: Build for iOS Simulator (unsigned)
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build | tail -n 40
          test -d build/Build/Products/Debug-iphonesimulator/App.app
      - name: Run in the simulator and check the native plugins
        run: |
          DEVICE=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          xcrun simctl boot "$DEVICE"
          xcrun simctl install "$DEVICE" build/Build/Products/Debug-iphonesimulator/App.app
          # console-pty streams the app's stdout (Capacitor logs every JS -> native call)
          script -q -F app.log xcrun simctl launch --console-pty "$DEVICE" com.austin410203.seasontree > /dev/null 2>&1 &
          sleep 40
          xcrun simctl io "$DEVICE" screenshot sim.png || true
          grep -E "To Native ->|ERROR|error" app.log | head -n 40 || true
          grep -q "To Native ->  Store getEntitlements" app.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: simulator
          path: |
            sim.png
            app.log
          if-no-files-found: ignore

  testflight:
    if: github.event_name == 'workflow_dispatch' && inputs.testflight
    needs: build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -n 1)"
      - run: npm ci
      - run: node scripts/build-www.mjs && npx cap sync ios
      - name: Write App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Archive and upload
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          AUTH="-allowProvisioningUpdates -authenticationKeyPath $HOME/private_keys/AuthKey_$KEY_ID.p8 -authenticationKeyID $KEY_ID -authenticationKeyIssuerID $ISSUER"
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/App.xcarchive \
            DEVELOPMENT_TEAM=$TEAM CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            $AUTH archive | tail -n 40
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/App.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export $AUTH | tail -n 40
