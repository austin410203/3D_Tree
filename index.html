<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>靜心時光</title>
<meta name="description" content="靜心時光：11 個會跟著呼吸變化的冥想場景，呼吸引導、靜心計時、白噪音與入睡模式。">
<meta name="theme-color" content="#f7dce8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="靜心時光">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="app"></div>

<!-- intro: shown on every launch; the start button enters the app and unlocks sound -->
<div id="intro" class="intro">
  <i class="bokeh b1"></i><i class="bokeh b2"></i><i class="bokeh b3"></i>
  <div class="intro-card">
    <img class="intro-icon" src="icons/icon-512.png" alt="">
    <h1 data-i18n="appName">靜心時光</h1>
    <p class="intro-en">Calm Moments</p>
    <p class="intro-tag" data-i18n="tagline">跟著畫面，慢慢呼吸</p>
    <div class="intro-scenes" aria-hidden="true">
      <img src="icons/ui/scene-tree.png" alt=""><img src="icons/ui/scene-sea.png" alt=""><img src="icons/ui/scene-lotus.png" alt="">
      <img src="icons/ui/scene-camp.png" alt=""><img src="icons/ui/scene-whale.png" alt=""><img src="icons/ui/scene-aurora.png" alt="">
    </div>
    <p class="intro-feat" data-i18n="introFeatures">11 個冥想場景・呼吸引導・白噪音・入睡</p>
  </div>
  <button id="introStart" class="intro-start" data-i18n="tapToStart">開始</button>
</div>

<div id="ui" class="ui">
  <header class="top">
    <button id="langBtn" class="lang-btn" data-sheet="lang" aria-label="Language">🌐 <b id="langCode">中</b></button>
    <div class="title">
      <h1 id="sceneName">四季之樹</h1>
      <p id="sub">春・白天</p>
    </div>
  </header>

  <!-- home -->
  <section id="home" class="home">
    <div class="durations" id="durations">
      <button data-min="3">3 分</button>
      <button data-min="5">5 分</button>
      <button data-min="10">10 分</button>
      <button data-min="20">20 分</button>
      <button data-min="0">不計時</button>
    </div>
    <button id="start" class="start" data-i18n="start">開始靜心</button>
    <nav class="tools">
      <button data-sheet="sound"><img class="ico" src="icons/ui/sound.png" alt="" data-fallback="🎧"><em data-i18n="tool.sound">聲音</em></button>
      <button data-sheet="breath"><img class="ico" src="icons/ui/breath.png" alt="" data-fallback="🍃"><em data-i18n="tool.breath">呼吸</em></button>
      <button data-sheet="scene"><img class="ico" src="icons/ui/scene.png" alt="" data-fallback="🌳"><em data-i18n="tool.scene">場景</em></button>
      <button data-sheet="sleep"><img class="ico" src="icons/ui/sleep.png" alt="" data-fallback="🌙"><em data-i18n="tool.sleep">入睡</em></button>
      <button data-sheet="stats"><img class="ico" src="icons/ui/stats.png" alt="" data-fallback="📖"><em data-i18n="tool.stats">紀錄</em></button>
    </nav>
  </section>

  <!-- session -->
  <section id="session" class="session">
    <div class="timer" id="timer">05:00</div>
    <div class="breath">
      <div class="ring" id="ring">
        <i class="orb" id="orb"></i>
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="47" />
          <circle class="arc" id="arc" cx="50" cy="50" r="47" pathLength="100" />
        </svg>
        <b id="count"></b>
      </div>
      <p id="breathText">準備</p>
      <p id="breathHint" class="hint2">放鬆肩膀，跟著樹一起呼吸</p>
    </div>
    <button id="stop" class="ghost" data-i18n="stop">結束</button>
  </section>

  <!-- done -->
  <section id="done" class="done">
    <div class="card">
      <p class="big" id="doneTitle">完成 5 分鐘靜心</p>
      <p id="doneStats">連續 1 天・累計 5 分鐘</p>
      <div class="week" id="doneWeek"></div>
      <button id="doneOk" class="start small" data-i18n="ok">好</button>
    </div>
  </section>
</div>

<!-- sheets -->
<div id="scrim" class="scrim"></div>

<section class="sheet" id="sheet-sound">
  <header><h2 data-i18n="sheet.sound">聲音</h2><button class="close" data-i18n-aria="close">✕</button></header>
  <div class="chips" id="presets"></div>
  <div class="mixer" id="mixer"></div>
  <label class="row"><span data-i18n="master">總音量</span><input id="master" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  <p class="note" data-i18n="soundNote">所有聲音都是即時合成，不需網路。</p>
</section>

<section class="sheet" id="sheet-breath">
  <header><h2 data-i18n="sheet.breath">呼吸</h2><button class="close" data-i18n-aria="close">✕</button></header>
  <div class="list" id="patterns"></div>
  <label class="row switch"><span data-i18n="cue">階段提示音</span><input id="cue" type="checkbox" checked></label>
  <label class="row switch"><span data-i18n="bowl">頌缽開場與結束</span><input id="bowl" type="checkbox" checked></label>
  <label class="row switch"><span data-i18n="haptic">震動提示</span><input id="haptic" type="checkbox"></label>
</section>

<section class="sheet" id="sheet-scene">
  <header><h2 data-i18n="sheet.scene">場景</h2><button class="close" data-i18n-aria="close">✕</button></header>
  <div class="list scenes" id="sceneList"></div>
  <div id="seasonBox"><h3 data-i18n="season">季節</h3>
  <div class="chips" id="seasonChips"></div></div>
  <div id="timeBox"><h3 data-i18n="time">時間</h3>
  <div class="chips" id="timeChips"></div></div>
  <label class="row"><span data-i18n="wind">風</span><input id="wind" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  <label class="row"><span id="fallLabel">落葉</span><input id="fall" type="range" min="0" max="2" step="0.01" value="1"></label>
  <button id="regrow" class="wide">重新長一棵樹</button>
</section>

<section class="sheet" id="sheet-sleep">
  <header><h2 data-i18n="sheet.sleep">入睡</h2><button class="close" data-i18n-aria="close">✕</button></header>
  <p class="note big" data-i18n="sleepIntro">邊聽邊睡：開始後可以直接關掉螢幕，聲音會繼續播放；時間到前一分鐘會慢慢轉小聲，然後停止。</p>
  <h3 data-i18n="sleepAfter">多久後停止</h3>
  <div class="chips" id="sleepTimes"></div>
  <h3 data-i18n="sleepSound">聲音</h3>
  <div class="chips" id="sleepSounds"></div>
  <button id="sleepStart" class="start small wide-start" data-i18n="sleepStart">開始入睡</button>
</section>

<section class="sheet" id="sheet-stats">
  <header><h2 data-i18n="sheet.stats">紀錄</h2><button class="close" data-i18n-aria="close">✕</button></header>
  <div class="stats" id="stats"></div>
  <div class="week" id="statsWeek"></div>
  <div id="remindBox" hidden>
    <label class="row switch"><span data-i18n="remind">每日提醒</span><input id="remind" type="checkbox"></label>
    <label class="row"><span data-i18n="remindTime">提醒時間</span><input id="remindTime" type="time" value="21:30"></label>
  </div>
</section>

<section class="sheet" id="sheet-lang">
  <header><h2 data-i18n="language">語言</h2><button class="close" data-i18n-aria="close">✕</button></header>
  <div class="list" id="langList"></div>
</section>

<div id="sleep" class="sleep">
  <div class="sleep-box">
    <p class="moon"><img class="ico big-ico" src="icons/ui/sleep.png" alt="" data-fallback="🌙"></p>
    <p class="big" id="sleepTitle">入睡中</p>
    <p id="sleepLeft">還有 30:00，之後慢慢停止</p>
    <p class="note" id="sleepNote">可以直接關掉螢幕，聲音會繼續播放</p>
    <button id="sleepEnd" class="ghost-btn" data-i18n="sleepEnd">結束入睡</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
