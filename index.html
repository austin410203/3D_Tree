<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>四季之樹・靜心</title>
<meta name="description" content="跟著一棵四季的樹呼吸：呼吸引導、靜心計時與白噪音。">
<meta name="theme-color" content="#f7dce8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="四季之樹">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<div id="app"></div>

<div id="ui" class="ui">
  <header class="top">
    <div class="title">
      <h1 id="sceneName">四季之樹</h1>
      <p id="sub">春・白天</p>
    </div>
  </header>

  <!-- home -->
  <section id="home" class="home">
    <div class="durations" id="durations">
      <button data-min="3">3 分</button>
      <button data-min="5">5 分</button>
      <button data-min="10">10 分</button>
      <button data-min="20">20 分</button>
      <button data-min="0">不計時</button>
    </div>
    <button id="start" class="start">開始靜心</button>
    <nav class="tools">
      <button data-sheet="sound"><span>🎧</span>聲音</button>
      <button data-sheet="breath"><span>🍃</span>呼吸</button>
      <button data-sheet="scene"><span>🌳</span>場景</button>
      <button data-sheet="sleep"><span>🌙</span>入睡</button>
      <button data-sheet="stats"><span>📖</span>紀錄</button>
    </nav>
  </section>

  <!-- session -->
  <section id="session" class="session">
    <div class="timer" id="timer">05:00</div>
    <div class="breath">
      <div class="ring" id="ring">
        <i class="orb" id="orb"></i>
        <svg viewBox="0 0 100 100" aria-hidden="true">
          <circle class="track" cx="50" cy="50" r="47" />
          <circle class="arc" id="arc" cx="50" cy="50" r="47" pathLength="100" />
        </svg>
        <b id="count"></b>
      </div>
      <p id="breathText">準備</p>
      <p id="breathHint" class="hint2">放鬆肩膀，跟著樹一起呼吸</p>
    </div>
    <button id="stop" class="ghost">結束</button>
  </section>

  <!-- done -->
  <section id="done" class="done">
    <div class="card">
      <p class="big" id="doneTitle">完成 5 分鐘靜心</p>
      <p id="doneStats">連續 1 天・累計 5 分鐘</p>
      <div class="week" id="doneWeek"></div>
      <button id="doneOk" class="start small">好</button>
    </div>
  </section>
</div>

<!-- sheets -->
<div id="scrim" class="scrim"></div>

<section class="sheet" id="sheet-sound">
  <header><h2>聲音</h2><button class="close" aria-label="關閉">✕</button></header>
  <div class="chips" id="presets"></div>
  <div class="mixer" id="mixer"></div>
  <label class="row">總音量<input id="master" type="range" min="0" max="1" step="0.01" value="0.8"></label>
  <p class="note">所有聲音都是即時合成，不需網路。</p>
</section>

<section class="sheet" id="sheet-breath">
  <header><h2>呼吸</h2><button class="close" aria-label="關閉">✕</button></header>
  <div class="list" id="patterns"></div>
  <label class="row switch">階段提示音<input id="cue" type="checkbox" checked></label>
  <label class="row switch">頌缽開場與結束<input id="bowl" type="checkbox" checked></label>
  <label class="row switch">震動提示<input id="haptic" type="checkbox"></label>
</section>

<section class="sheet" id="sheet-scene">
  <header><h2>場景</h2><button class="close" aria-label="關閉">✕</button></header>
  <div class="list scenes" id="sceneList"></div>
  <div id="seasonBox"><h3>季節</h3>
  <div class="chips" id="seasonChips"></div></div>
  <div id="timeBox"><h3>時間</h3>
  <div class="chips" id="timeChips"></div></div>
  <label class="row">風<input id="wind" type="range" min="0" max="1" step="0.01" value="0.4"></label>
  <label class="row"><span id="fallLabel">落葉</span><input id="fall" type="range" min="0" max="2" step="0.01" value="1"></label>
  <button id="regrow" class="wide">重新長一棵樹</button>
</section>

<section class="sheet" id="sheet-sleep">
  <header><h2>入睡</h2><button class="close" aria-label="關閉">✕</button></header>
  <p class="note big">邊聽邊睡：開始後可以直接關掉螢幕，聲音會繼續播放；時間到前一分鐘會慢慢轉小聲，然後停止。</p>
  <h3>多久後停止</h3>
  <div class="chips" id="sleepTimes"></div>
  <h3>聲音</h3>
  <div class="chips" id="sleepSounds"></div>
  <button id="sleepStart" class="start small wide-start">開始入睡</button>
</section>

<section class="sheet" id="sheet-stats">
  <header><h2>紀錄</h2><button class="close" aria-label="關閉">✕</button></header>
  <div class="stats" id="stats"></div>
  <div class="week" id="statsWeek"></div>
  <div id="remindBox" hidden>
    <label class="row switch">每日提醒<input id="remind" type="checkbox"></label>
    <label class="row">提醒時間<input id="remindTime" type="time" value="21:30"></label>
  </div>
</section>

<div id="sleep" class="sleep">
  <div class="sleep-box">
    <p class="moon">🌙</p>
    <p class="big" id="sleepTitle">入睡中</p>
    <p id="sleepLeft">還有 30:00，之後慢慢停止</p>
    <p class="note" id="sleepNote">可以直接關掉螢幕，聲音會繼續播放</p>
    <button id="sleepEnd" class="ghost-btn">結束入睡</button>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
