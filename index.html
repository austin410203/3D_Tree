<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>四季之樹 Season Tree</title>
<meta name="description" content="three.js 互動四季之樹：一萬多片葉子的風格化樹冠，季節換色動畫、落葉與飄雪。">
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="app"></div>

<header class="title">
  <h1>四季之樹</h1>
  <p>Season Tree</p>
</header>

<nav class="seasons" id="seasons">
  <button data-s="0" title="春 (1)"><span>🌸</span><b>春</b></button>
  <button data-s="1" title="夏 (2)"><span>🌿</span><b>夏</b></button>
  <button data-s="2" title="秋 (3)"><span>🍁</span><b>秋</b></button>
  <button data-s="3" title="冬 (4)"><span>❄️</span><b>冬</b></button>
  <i class="sep"></i>
  <button id="auto" class="auto" title="自動輪替四季 (A)"><span>⟳</span><b>自動</b></button>
</nav>

<section class="panel" id="panel">
  <label>風力<input id="wind" type="range" min="0" max="1" step="0.01" value="0.45"></label>
  <label>落葉量<input id="fall" type="range" min="0" max="2" step="0.01" value="1"></label>
  <button id="gust" title="吹一陣強風 (G)">吹一陣風</button>
  <button id="regrow" title="重新長一棵 (R)">重新長一棵</button>
</section>

<p class="hint">拖曳旋轉・滾輪或雙指縮放</p>

<script type="module" src="main.js"></script>
</body>
</html>
